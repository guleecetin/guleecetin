<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" fill="none">
<defs>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8B5CF6"/><stop offset=".55" stop-color="#EC4899"/><stop offset="1" stop-color="#F59E0B"/>
  </linearGradient>
  <linearGradient id="gradv" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8B5CF6"/><stop offset=".55" stop-color="#EC4899"/><stop offset="1" stop-color="#F59E0B"/>
  </linearGradient>
  <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8B5CF6" stop-opacity=".55"/><stop offset=".5" stop-color="#26263D"/><stop offset="1" stop-color="#EC4899" stop-opacity=".35"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
  <radialGradient id="fadeg" cx=".3" cy=".4" r=".8"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="fade"><rect width="1000" height="360" fill="url(#fadeg)"/></mask>
</defs>
<style>
  text { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes ring { 0% { r: 4; opacity: .7; } 100% { r: 11; opacity: 0; } }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-30px,18px); } }
  @keyframes fadeup { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  .ring { animation: ring 2s ease-out infinite; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .drift { animation: drift 14s ease-in-out infinite; }
  .drift2 { animation: drift 18s ease-in-out infinite reverse; }
  
</style>

<clipPath id="hclip"><rect width="1000" height="360" rx="24"/></clipPath>
<g clip-path="url(#hclip)">
  <rect width="1000" height="360" fill="#0B0B12"/>
  <g stroke="#ffffff" stroke-opacity=".035" mask="url(#fade)"><line x1="0" y1="0" x2="0" y2="360"/><line x1="40" y1="0" x2="40" y2="360"/><line x1="80" y1="0" x2="80" y2="360"/><line x1="120" y1="0" x2="120" y2="360"/><line x1="160" y1="0" x2="160" y2="360"/><line x1="200" y1="0" x2="200" y2="360"/><line x1="240" y1="0" x2="240" y2="360"/><line x1="280" y1="0" x2="280" y2="360"/><line x1="320" y1="0" x2="320" y2="360"/><line x1="360" y1="0" x2="360" y2="360"/><line x1="400" y1="0" x2="400" y2="360"/><line x1="440" y1="0" x2="440" y2="360"/><line x1="480" y1="0" x2="480" y2="360"/><line x1="520" y1="0" x2="520" y2="360"/><line x1="560" y1="0" x2="560" y2="360"/><line x1="600" y1="0" x2="600" y2="360"/><line x1="640" y1="0" x2="640" y2="360"/><line x1="680" y1="0" x2="680" y2="360"/><line x1="720" y1="0" x2="720" y2="360"/><line x1="760" y1="0" x2="760" y2="360"/><line x1="800" y1="0" x2="800" y2="360"/><line x1="840" y1="0" x2="840" y2="360"/><line x1="880" y1="0" x2="880" y2="360"/><line x1="920" y1="0" x2="920" y2="360"/><line x1="960" y1="0" x2="960" y2="360"/><line x1="1000" y1="0" x2="1000" y2="360"/><line x1="0" y1="0" x2="1000" y2="0"/><line x1="0" y1="40" x2="1000" y2="40"/><line x1="0" y1="80" x2="1000" y2="80"/><line x1="0" y1="120" x2="1000" y2="120"/><line x1="0" y1="160" x2="1000" y2="160"/><line x1="0" y1="200" x2="1000" y2="200"/><line x1="0" y1="240" x2="1000" y2="240"/><line x1="0" y1="280" x2="1000" y2="280"/><line x1="0" y1="320" x2="1000" y2="320"/><line x1="0" y1="360" x2="1000" y2="360"/></g>
  <circle class="drift" cx="860" cy="40" r="200" fill="#8B5CF6" opacity=".45" filter="url(#blur)"/>
  <circle class="drift2" cx="980" cy="330" r="150" fill="#EC4899" opacity=".35" filter="url(#blur)"/>
  <circle class="drift" cx="560" cy="380" r="120" fill="#F59E0B" opacity=".18" filter="url(#blur)"/>
</g>
<rect x=".5" y=".5" width="999" height="359" rx="23.5" stroke="url(#stroke)"/>

<g style="animation: fadeup .8s ease-out both">
  <rect x="48" y="52" width="150" height="30" rx="15" fill="#0F2A22" stroke="#1E5B47"/>
  <circle cx="66" cy="67" r="4" fill="#34D399"/>
  <circle cx="66" cy="67" r="4" stroke="#34D399" fill="none" class="ring"/>
  <text x="80" y="72" font-size="13" font-weight="600" fill="#A7F3D0">Open to work</text>

  <text x="46" y="158" font-size="58" font-weight="700" fill="#EEEEF6" letter-spacing="-1.5">Gülendam Çetin</text>
  <text x="48" y="202" font-size="26" font-weight="600" fill="url(#grad)">Backend Developer</text>
  <text x="48" y="240" font-size="16" fill="#9494B0">Computer engineer building scalable .NET microservices,</text>
  <text x="48" y="263" font-size="16" fill="#9494B0">from e-document pipelines to event-driven systems.</text>
  <rect x="48" y="286" width="101.7" height="28" rx="14.0" fill="#14141F" stroke="#26263D"/><text x="61.0" y="304.7" font-size="13" font-weight="400" fill="#C9C9DD">C# · .NET 10</text><rect x="157.6875" y="286" width="112.7" height="28" rx="14.0" fill="#14141F" stroke="#26263D"/><text x="170.7" y="304.7" font-size="13" font-weight="400" fill="#C9C9DD">Microservices</text><rect x="278.34375" y="286" width="106.5" height="28" rx="14.0" fill="#14141F" stroke="#26263D"/><text x="291.3" y="304.7" font-size="13" font-weight="400" fill="#C9C9DD">Kafka · gRPC</text><rect x="392.8125" y="286" width="98.9" height="28" rx="14.0" fill="#14141F" stroke="#26263D"/><text x="405.8" y="304.7" font-size="13" font-weight="400" fill="#C9C9DD">PostgreSQL</text>
</g>

<g style="animation: fadeup 1s .2s ease-out both">
  <rect x="600" y="62" width="352" height="236" rx="14" fill="#0E0E17" fill-opacity=".85" stroke="#26263D"/>
  <path d="M600 102 H952" stroke="#26263D"/>
  <circle cx="622" cy="82" r="5.5" fill="#FF5F57"/>
  <circle cx="640" cy="82" r="5.5" fill="#FEBC2E"/>
  <circle cx="658" cy="82" r="5.5" fill="#28C840"/>
  <text class="mono" x="790.0" y="87" font-size="12" fill="#5E5E7A" text-anchor="middle">~/gulendam — zsh</text>
  <text class="mono" x="622" y="140" font-size="13.5"><tspan fill="#EC4899">$ </tspan><tspan fill="#EEEEF6">whoami</tspan></text><text class="mono" x="622" y="164" font-size="13.5" fill="#9494B0">gulendam · backend developer</text><text class="mono" x="622" y="188" font-size="13.5"><tspan fill="#EC4899">$ </tspan><tspan fill="#EEEEF6">cat focus.txt</tspan></text><text class="mono" x="622" y="212" font-size="13.5" fill="#9494B0">distributed systems, clean APIs,</text><text class="mono" x="622" y="236" font-size="13.5" fill="#9494B0">event-driven .NET services</text><text class="mono" x="622" y="260" font-size="13.5"><tspan fill="#EC4899">$ </tspan><tspan fill="#EEEEF6">status --now</tspan></text><circle cx="627" cy="279.5" r="4" fill="#34D399" class="pulse"/><text class="mono" x="640" y="284" font-size="13.5" fill="#34D399">open to work</text><rect class="blink" x="740" y="271" width="8" height="16" fill="#EEEEF6"/>
</g>

</svg>