<svg xmlns="http://www.w3.org/2000/svg" width="490" height="250" viewBox="0 0 490 250" fill="none">
<defs>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8B5CF6"/><stop offset=".55" stop-color="#EC4899"/><stop offset="1" stop-color="#F59E0B"/>
  </linearGradient>
  <linearGradient id="gradv" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8B5CF6"/><stop offset=".55" stop-color="#EC4899"/><stop offset="1" stop-color="#F59E0B"/>
  </linearGradient>
  <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8B5CF6" stop-opacity=".55"/><stop offset=".5" stop-color="#26263D"/><stop offset="1" stop-color="#EC4899" stop-opacity=".35"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
  
</defs>
<style>
  text { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes ring { 0% { r: 4; opacity: .7; } 100% { r: 11; opacity: 0; } }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-30px,18px); } }
  @keyframes fadeup { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  .ring { animation: ring 2s ease-out infinite; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .drift { animation: drift 14s ease-in-out infinite; }
  .drift2 { animation: drift 18s ease-in-out infinite reverse; }
  
</style>

<clipPath id="pc"><rect width="490" height="250" rx="18"/></clipPath>
<rect width="490" height="250" rx="18" fill="#11111B"/>
<g clip-path="url(#pc)">
  <circle class="drift" cx="450" cy="0" r="120" fill="#8B5CF6" opacity=".22" filter="url(#blur)"/>
  <rect width="490" height="3" fill="url(#grad)"/>
</g>
<rect x=".5" y=".5" width="489" height="249" rx="17.5" stroke="url(#stroke)"/>
<rect x="32" y="28" width="44" height="44" rx="12" fill="#8B5CF6" fill-opacity=".14" stroke="#8B5CF6" stroke-opacity=".45"/>
<text x="54" y="58" font-size="21" font-weight="700" fill="#8B5CF6" text-anchor="middle">O</text>
<text x="90" y="56" font-size="20" font-weight="700" fill="#EEEEF6">Organica</text>

<text x="32" y="110" font-size="14.5" fill="#BDBDD3">Organic food e-commerce with a storefront, admin panel and</text><text x="32" y="132" font-size="14.5" fill="#BDBDD3">a microservice backend behind an API gateway.</text>
<rect x="32" y="170" width="112.2" height="24" rx="12.0" fill="#161624" stroke="#26263D"/><text x="42.0" y="186.3" font-size="12" font-weight="400" fill="#C9C9DD">ASP.NET Core 8</text><rect x="150.171875" y="170" width="100.0" height="24" rx="12.0" fill="#161624" stroke="#26263D"/><text x="160.2" y="186.3" font-size="12" font-weight="400" fill="#C9C9DD">Microservices</text><rect x="256.171875" y="170" width="75.9" height="24" rx="12.0" fill="#161624" stroke="#26263D"/><text x="266.2" y="186.3" font-size="12" font-weight="400" fill="#C9C9DD">RabbitMQ</text><rect x="338.09375" y="170" width="50.9" height="24" rx="12.0" fill="#161624" stroke="#26263D"/><text x="348.1" y="186.3" font-size="12" font-weight="400" fill="#C9C9DD">YARP</text>
<line x1="32" y1="204" x2="458" y2="204" stroke="#26263D"/>
<text class="mono" x="32" y="230" font-size="12.5" fill="#9494B0">↗ github.com/guleecetin</text>

</svg>