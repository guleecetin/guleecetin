<svg xmlns="http://www.w3.org/2000/svg" width="110" height="44" viewBox="0 0 110 44" fill="none">
<defs>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8B5CF6"/><stop offset=".55" stop-color="#EC4899"/><stop offset="1" stop-color="#F59E0B"/>
  </linearGradient>
  <linearGradient id="gradv" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8B5CF6"/><stop offset=".55" stop-color="#EC4899"/><stop offset="1" stop-color="#F59E0B"/>
  </linearGradient>
  <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8B5CF6" stop-opacity=".55"/><stop offset=".5" stop-color="#26263D"/><stop offset="1" stop-color="#EC4899" stop-opacity=".35"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
  
</defs>
<style>
  text { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes ring { 0% { r: 4; opacity: .7; } 100% { r: 11; opacity: 0; } }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-30px,18px); } }
  @keyframes fadeup { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  .ring { animation: ring 2s ease-out infinite; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .drift { animation: drift 14s ease-in-out infinite; }
  .drift2 { animation: drift 18s ease-in-out infinite reverse; }
  
</style>

<rect x=".5" y=".5" width="110" height="43" rx="21.5" fill="#11111B" stroke="url(#stroke)"/>
<circle cx="24" cy="22.0" r="5" fill="#EEEEF6"/>
<text x="38" y="27.0" font-size="14" font-weight="600" fill="#EEEEF6">GitHub</text>
<text x="89" y="27.0" font-size="14" fill="#9494B0">↗</text>

</svg>